name: build-signall
on:
  workflow_dispatch:
env:
  DOCUMENSO_VERSION: v2.21.1
  TAG: v2.21.1-signall.1
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Documenso source
        run: git clone --depth 1 --branch "$DOCUMENSO_VERSION" https://github.com/documenso/documenso.git src
      - name: Apply patch (fails if it does not fit)
        run: cd src && git apply --check ../sign-all.patch && git apply ../sign-all.patch
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src
          file: src/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/documenso-signall:${{ env.TAG }}
